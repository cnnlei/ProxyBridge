name: Build Windows

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read

    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Apply issue 206 stale decision-cache fix
      run: |
        $path = 'Windows\src\ProxyBridge.c'
        $s = (Get-Content $path -Raw) -replace "`r`n", "`n"

        $old6 = @(
          '                UINT16 sp = ntohs(tcp_header->SrcPort);',
          '                UINT16 dp = ntohs(tcp_header->DstPort);',
          '',
          '                if (port_is_decided(sp))'
        ) -join "`n"
        $new6 = @(
          '                UINT16 sp = ntohs(tcp_header->SrcPort);',
          '                UINT16 dp = ntohs(tcp_header->DstPort);',
          '',
          '                // #206: a fresh SYN starts a new connection generation. Clear stale state.',
          '                if (tcp_header->Syn && !tcp_header->Ack)',
          '                    port_clear(sp);',
          '',
          '                if (port_is_decided(sp))'
        ) -join "`n"
        if (-not $s.Contains($old6)) { throw 'IPv6 patch anchor not found' }
        $s = $s.Replace($old6, $new6)

        $old4 = @(
          '                if (tcp_header->Syn && !tcp_header->Ack)',
          '                    remove_cached_pid(ip_header->SrcAddr, sp, FALSE);',
          '',
          '                if (port_is_decided(sp))'
        ) -join "`n"
        $new4 = @(
          '                if (tcp_header->Syn && !tcp_header->Ack)',
          '                {',
          '                    remove_cached_pid(ip_header->SrcAddr, sp, FALSE);',
          '                    // #206: recycled ports must not inherit old DIRECT/PROXY/BLOCK state.',
          '                    port_clear(sp);',
          '                }',
          '',
          '                if (port_is_decided(sp))'
        ) -join "`n"
        if (-not $s.Contains($old4)) { throw 'IPv4 patch anchor not found' }
        $s = $s.Replace($old4, $new4)
        Set-Content -Path $path -Value $s -NoNewline
      shell: pwsh

    - name: Install NSIS
      run: |
        choco install nsis -y
      shell: pwsh

    - name: Install NSIS EnVar plugin
      run: |
        $nsisPluginDir = "C:\Program Files (x86)\NSIS\Plugins\x86-unicode"
        $url = "https://nsis.sourceforge.io/mediawiki/images/7/7f/EnVar_plugin.zip"
        $expectedHash = "E9AA92DE351345ED82795251D838F1AE9041BA35AF9D381A5780C7843B01F56A"
        Invoke-WebRequest -Uri $url -OutFile "EnVar.zip" -UseBasicParsing
        $actualHash = (Get-FileHash "EnVar.zip" -Algorithm SHA256).Hash
        if ($actualHash -ne $expectedHash) {
          Write-Error "EnVar.zip SHA256 mismatch! Expected: $expectedHash  Got: $actualHash"
          exit 1
        }
        Expand-Archive -Path "EnVar.zip" -DestinationPath "EnVar"
        Copy-Item "EnVar\Plugins\x86-unicode\EnVar.dll" -Destination $nsisPluginDir -Force
        Write-Host "EnVar plugin installed successfully"
      shell: pwsh

    - name: Download WinDivert
      run: |
        $url = "https://github.com/basil00/WinDivert/releases/download/v2.2.2/WinDivert-2.2.2-A.zip"
        $expectedHash = "63CB41763BB4B20F600B6DE04E991A9C2BE73279E317D4D82F237B150C5F3F15"
        Invoke-WebRequest -Uri $url -OutFile "WinDivert.zip" -UseBasicParsing
        $actualHash = (Get-FileHash "WinDivert.zip" -Algorithm SHA256).Hash
        if ($actualHash -ne $expectedHash) {
          Write-Error "WinDivert.zip SHA256 mismatch! Expected: $expectedHash  Got: $actualHash"
          exit 1
        }
        Expand-Archive -Path "WinDivert.zip" -DestinationPath "C:\"
      shell: pwsh

    - name: Verify WinDivert installation
      run: |
        if (Test-Path "C:\WinDivert-2.2.2-A") {
          Write-Host "WinDivert installed successfully"
          Get-ChildItem "C:\WinDivert-2.2.2-A" -Recurse | Select-Object FullName
        } else {
          Write-Error "WinDivert installation failed"
          exit 1
        }
      shell: pwsh

    - name: Build project
      run: |
        cd Windows
        .\compile.ps1 -NoSign
      shell: pwsh

    - name: Add build metadata
      run: |
        "Base: dev / 4.0.13-Beta current native Win32 UI" | Set-Content Windows\output\BUILD-INFO.txt
        "Fix: #206 fresh TCP SYN invalidates stale per-source-port decision cache for IPv4 and IPv6" | Add-Content Windows\output\BUILD-INFO.txt
        "Source branch: windows-4.0.13-current-ui-fixed" | Add-Content Windows\output\BUILD-INFO.txt
        Get-ChildItem Windows\output -File | Sort-Object Name | ForEach-Object {
          $h = Get-FileHash $_.FullName -Algorithm SHA256
          "$($h.Hash)  $($_.Name)"
        } | Set-Content Windows\output\SHA256SUMS.txt
      shell: pwsh

    - name: Upload artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: ProxyBridge-4.0.13-Beta-CurrentUI-Fixed
        path: Windows/output/
        retention-days: 30

    - name: List output files
      run: |
        Write-Host "`nBuild artifacts:"
        Get-ChildItem Windows/output -Recurse | ForEach-Object {
          $size = [math]::Round($_.Length/1MB, 2)
          Write-Host "  $($_.Name) - $size MB"
        }
      shell: pwsh
